name: Android build (Miga)

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # release: push directo a main (normalmente tras fusionar un PR) -> build completo + Release.
      # pr_check: pull request hacia main -> solo comprobaciones (lint + compilar), no se publica nada.
      # dev_debug: push a cualquier otra rama, o ejecución manual -> solo un APK debug rápido.
      - name: Determine build mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "mode=pr_check" >> "$GITHUB_OUTPUT"
          else
            echo "mode=dev_debug" >> "$GITHUB_OUTPUT"
          fi
          # Los nombres de artefacto de GitHub Actions no admiten "/", que sí es válido en un
          # nombre de rama (ej. "setup/initial-import"); se sustituye por "-".
          echo "safe_ref=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Tests unitarios: se ejecutan siempre (cualquier push, PR o modo manual), no solo en
      # pull requests, para que un test roto bloquee el build igual que un fallo de compilación.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miga-unit-test-report-${{ steps.mode.outputs.safe_ref }}-${{ steps.mode.outputs.short_sha }}
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

      # El build "release" (mode == 'release') solo se dispara al hacer push a main; en cualquier
      # otro caso se valida aquí que assembleRelease sigue compilando con isMinifyEnabled=true,
      # para que una regla de ProGuard/R8 rota se detecte en esta misma rama y no solo al fusionar.
      # Sale sin firmar (no hay secretos de keystore en este paso) y no se publica en ningún sitio.
      - name: Build release APK (validar minificación con R8)
        if: steps.mode.outputs.mode != 'release'
        run: ./gradlew :app:assembleRelease --stacktrace

      # --- pull request hacia main: lint + compilación de comprobación ---
      - name: Lint (pull request)
        if: steps.mode.outputs.mode == 'pr_check'
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build debug APK (pull request)
        if: steps.mode.outputs.mode == 'pr_check'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK (pull request)
        if: steps.mode.outputs.mode == 'pr_check'
        uses: actions/upload-artifact@v4
        with:
          name: miga-debug-pr${{ github.event.pull_request.number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # --- push a una rama que no es main (o ejecución manual): solo un APK debug ---
      - name: Build debug APK (rama de desarrollo)
        if: steps.mode.outputs.mode == 'dev_debug'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK (rama de desarrollo)
        if: steps.mode.outputs.mode == 'dev_debug'
        uses: actions/upload-artifact@v4
        with:
          name: miga-debug-${{ steps.mode.outputs.safe_ref }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Además del artefacto de la propia ejecución, se publica/actualiza una única Release
      # "beta-latest" (canal beta del selector de actualizaciones dentro de la app) con el APK
      # debug más reciente de cualquier rama de desarrollo, para poder probarlo sin entrar a
      # Actions. El tag es fijo a propósito: cada push la sobrescribe, no se acumulan releases.
      - name: Normalize debug APK names (canal beta)
        if: steps.mode.outputs.mode == 'dev_debug'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          for f in app/build/outputs/apk/debug/*.apk; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            abi="${base#app-}"
            abi="${abi%-debug.apk}"
            cp "$f" "dist/miga-v${VERSION}-${abi}-debug.apk"
          done
          echo "Ficheros generados:"
          ls -la dist

      - name: Publish beta-latest Release
        if: steps.mode.outputs.mode == 'dev_debug'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-latest
          name: "Miga v${{ steps.version.outputs.version }} (beta · ${{ github.ref_name }} · ${{ steps.mode.outputs.short_sha }})"
          body: |
            Build de desarrollo automático, generado desde la rama `${{ github.ref_name }}`
            (commit ${{ github.sha }}). No es una versión estable: se sobrescribe en cada push
            a una rama que no es `main`.
          prerelease: true
          make_latest: false
          files: dist/*

      # --- push a main: build completo (debug + release por ABI + AAB) y Release en GitHub ---
      # El keystore de release nunca vive en el repo (a diferencia de debug.keystore): se lee de
      # 4 secretos de GitHub Actions. Mientras no existan, el build release sale sin firmar sin
      # romper el CI, y la Release se marca como pre-release.
      - name: Decode release keystore
        if: steps.mode.outputs.mode == 'release'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build debug + release APKs (por ABI + universal)
        if: steps.mode.outputs.mode == 'release'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Build release AAB (Play Store)
        if: steps.mode.outputs.mode == 'release'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Normalize output file names
        if: steps.mode.outputs.mode == 'release'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SLUG="miga"
          mkdir -p dist

          rename_apks() {
            local dir="app/build/outputs/apk/$1"
            [ -d "$dir" ] || return 0
            for f in "$dir"/*.apk; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              mid="${base#app-}"
              mid="${mid%.apk}"
              suffix=""
              if [[ "$mid" == *-unsigned ]]; then
                mid="${mid%-unsigned}"
                suffix="-unsigned"
              fi
              abi="${mid%-*}"
              build_type="${mid##*-}"
              cp "$f" "dist/${SLUG}-v${VERSION}-${abi}-${build_type}${suffix}.apk"
            done
          }

          rename_apks debug
          rename_apks release

          # A diferencia de las APK, Gradle no añade "-unsigned" al nombre del AAB cuando no hay
          # signingConfig, así que la firma real se decide por si existe el keystore de release
          # (RELEASE_KEYSTORE_PATH, heredado del paso anterior), no por el nombre del fichero.
          aab_suffix=""
          if [ -z "${RELEASE_KEYSTORE_PATH:-}" ]; then
            aab_suffix="-unsigned"
          fi
          aab_dir="app/build/outputs/bundle/release"
          if [ -d "$aab_dir" ]; then
            for f in "$aab_dir"/*.aab; do
              [ -e "$f" ] || continue
              cp "$f" "dist/${SLUG}-v${VERSION}-release${aab_suffix}.aab"
            done
          fi

          echo "Ficheros generados:"
          ls -la dist

      - name: Upload build artifacts
        if: steps.mode.outputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: miga-builds-v${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: steps.mode.outputs.mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Miga v${{ steps.version.outputs.version }}
          prerelease: ${{ secrets.RELEASE_KEYSTORE_BASE64 == '' }}
          make_latest: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
          files: dist/*
