name: Android CI (Miga)

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  # Se ejecuta siempre (cualquier push, PR o modo manual), independientemente de lo que se vaya a
  # construir o publicar después - un test roto bloquea el resto igual que un fallo de compilación.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Nombre de artefacto único por rama+commit; no depende del "modo" (eso es cosa de build/
      # publish), solo necesita identificar de forma legible de qué ejecución viene.
      - name: Compute artifact name suffix
        id: ref
        if: always()
        run: |
          echo "safe_ref=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miga-unit-test-report-${{ steps.ref.outputs.safe_ref }}-${{ steps.ref.outputs.short_sha }}
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

  # Compila (y, según la rama, empaqueta) la app. El "modo" decide qué se construye exactamente:
  # release: push directo a main (normalmente tras fusionar un PR) -> build completo firmado.
  # pr_check: pull request hacia main -> solo comprobaciones (lint + compilar), nada que publicar.
  # dev_debug: push a cualquier otra rama, o ejecución manual -> solo un APK debug rápido.
  # Los ficheros listos para publicar quedan en dist/ y se suben como artefacto para que el job
  # publish (que corre en un runner distinto) pueda descargarlos sin tener que reconstruirlos.
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.version.outputs.version }}
      safe_ref: ${{ steps.mode.outputs.safe_ref }}
      short_sha: ${{ steps.mode.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # release: push directo a main (normalmente tras fusionar un PR) -> build completo + Release.
      # pr_check: pull request hacia main -> solo comprobaciones (lint + compilar), no se publica nada.
      # dev_debug: push a cualquier otra rama, o ejecución manual -> solo un APK debug rápido.
      - name: Determine build mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "mode=pr_check" >> "$GITHUB_OUTPUT"
          else
            echo "mode=dev_debug" >> "$GITHUB_OUTPUT"
          fi
          # Los nombres de artefacto de GitHub Actions no admiten "/", que sí es válido en un
          # nombre de rama (ej. "setup/initial-import"); se sustituye por "-".
          echo "safe_ref=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # En cualquier rama que NO vaya a hacer un build "release" de verdad (que ya compila con
      # isMinifyEnabled=true más abajo), se valida aquí que assembleRelease sigue compilando con
      # R8, para que una regla de ProGuard rota se detecte en esa misma rama y no solo al fusionar.
      # Sale sin firmar (no hay secretos de keystore en este paso) y no se publica en ningún sitio.
      - name: Build release APK (validar minificación con R8)
        if: steps.mode.outputs.mode != 'release'
        run: ./gradlew :app:assembleRelease --stacktrace

      # --- pull request hacia main: lint + compilación de comprobación ---
      - name: Lint (pull request)
        if: steps.mode.outputs.mode == 'pr_check'
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build debug APK (pull request)
        if: steps.mode.outputs.mode == 'pr_check'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK (pull request)
        if: steps.mode.outputs.mode == 'pr_check'
        uses: actions/upload-artifact@v4
        with:
          name: miga-debug-pr${{ github.event.pull_request.number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # --- push a una rama que no es main (o ejecución manual): solo un APK debug ---
      - name: Build debug APK (rama de desarrollo)
        if: steps.mode.outputs.mode == 'dev_debug'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK (rama de desarrollo)
        if: steps.mode.outputs.mode == 'dev_debug'
        uses: actions/upload-artifact@v4
        with:
          name: miga-debug-${{ steps.mode.outputs.safe_ref }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Prepara además una copia renombrada en dist/ (mismo criterio de nombre que usará el
      # Release del canal beta en el job publish) y la sube como artefacto propio, para que
      # publish no tenga que reconstruir nada.
      - name: Normalize debug APK names (canal beta)
        if: steps.mode.outputs.mode == 'dev_debug'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          for f in app/build/outputs/apk/debug/*.apk; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            abi="${base#app-}"
            abi="${abi%-debug.apk}"
            cp "$f" "dist/miga-v${VERSION}-${abi}-debug.apk"
          done
          echo "Ficheros generados:"
          ls -la dist

      - name: Upload beta dist (para el job publish)
        if: steps.mode.outputs.mode == 'dev_debug'
        uses: actions/upload-artifact@v4
        with:
          name: miga-beta-dist-${{ steps.mode.outputs.safe_ref }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      # --- push a main: build completo (debug + release por ABI + AAB) ---
      # El keystore de release nunca vive en el repo (a diferencia de debug.keystore): se lee de
      # 4 secretos de GitHub Actions. Mientras no existan, el build release sale sin firmar sin
      # romper el CI, y el job publish marca la Release resultante como pre-release.
      - name: Decode release keystore
        if: steps.mode.outputs.mode == 'release'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build debug + release APKs (por ABI + universal)
        if: steps.mode.outputs.mode == 'release'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Build release AAB (Play Store)
        if: steps.mode.outputs.mode == 'release'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Normalize output file names
        if: steps.mode.outputs.mode == 'release'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SLUG="miga"
          mkdir -p dist

          rename_apks() {
            local dir="app/build/outputs/apk/$1"
            [ -d "$dir" ] || return 0
            for f in "$dir"/*.apk; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              mid="${base#app-}"
              mid="${mid%.apk}"
              suffix=""
              if [[ "$mid" == *-unsigned ]]; then
                mid="${mid%-unsigned}"
                suffix="-unsigned"
              fi
              abi="${mid%-*}"
              build_type="${mid##*-}"
              cp "$f" "dist/${SLUG}-v${VERSION}-${abi}-${build_type}${suffix}.apk"
            done
          }

          rename_apks debug
          rename_apks release

          # A diferencia de las APK, Gradle no añade "-unsigned" al nombre del AAB cuando no hay
          # signingConfig, así que la firma real se decide por si existe el keystore de release
          # (RELEASE_KEYSTORE_PATH, heredado del paso anterior), no por el nombre del fichero.
          aab_suffix=""
          if [ -z "${RELEASE_KEYSTORE_PATH:-}" ]; then
            aab_suffix="-unsigned"
          fi
          aab_dir="app/build/outputs/bundle/release"
          if [ -d "$aab_dir" ]; then
            for f in "$aab_dir"/*.aab; do
              [ -e "$f" ] || continue
              cp "$f" "dist/${SLUG}-v${VERSION}-release${aab_suffix}.aab"
            done
          fi

          echo "Ficheros generados:"
          ls -la dist

      - name: Upload build artifacts
        if: steps.mode.outputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: miga-builds-v${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # No hay nada que publicar en un pull request (mode == pr_check): el job entero se salta y se ve
  # como "skipped" en los checks, en vez de un "success" vacío. Descarga el dist/ que ya dejó
  # preparado el job build (no reconstruye nada) y lo sube a una Release de GitHub.
  publish:
    name: Publish
    needs: build
    if: needs.build.outputs.mode != 'pr_check'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Además del artefacto de la propia ejecución (subido por build), se publica/actualiza una
      # única Release "beta-latest" (canal beta del selector de actualizaciones dentro de la app)
      # con el APK debug más reciente de cualquier rama de desarrollo. El tag es fijo a propósito:
      # cada push la sobrescribe, no se acumulan releases.
      - name: Download beta dist
        if: needs.build.outputs.mode == 'dev_debug'
        uses: actions/download-artifact@v4
        with:
          name: miga-beta-dist-${{ needs.build.outputs.safe_ref }}
          path: dist

      - name: Publish beta-latest Release
        if: needs.build.outputs.mode == 'dev_debug'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-latest
          name: "Miga v${{ needs.build.outputs.version }} (beta · ${{ github.ref_name }} · ${{ needs.build.outputs.short_sha }})"
          body: |
            Build de desarrollo automático, generado desde la rama `${{ github.ref_name }}`
            (commit ${{ github.sha }}). No es una versión estable: se sobrescribe en cada push
            a una rama que no es `main`.
          prerelease: true
          make_latest: false
          files: dist/*

      # --- push a main: Release estable en GitHub con todo lo que build dejó en dist/ ---
      - name: Download release dist
        if: needs.build.outputs.mode == 'release'
        uses: actions/download-artifact@v4
        with:
          name: miga-builds-v${{ needs.build.outputs.version }}
          path: dist

      - name: Create GitHub Release
        if: needs.build.outputs.mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Miga v${{ needs.build.outputs.version }}
          prerelease: ${{ secrets.RELEASE_KEYSTORE_BASE64 == '' }}
          make_latest: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
          files: dist/*
