name: Android CI (Miga)

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  # Always runs (any push, PR or manual run), whatever is built or published afterwards: a
  # broken test blocks the rest just like a compile error.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Every database version needs its Room schema (app/schemas) committed, or migrations to
      # later versions cannot be tested. The build exports it; a new or changed one fails here and
      # is printed so it can be committed.
      - name: Room schemas committed
        if: always()
        run: |
          changed=$(git status --porcelain --untracked-files=all app/schemas | cut -c4-)
          if [ -n "$changed" ]; then
            echo "::error::Room schema not committed: $changed"
            for f in $changed; do echo "===== $f"; cat "$f"; echo; done
            exit 1
          fi

      # Artifact name unique per branch and commit. It does not depend on the mode (that belongs to
      # build/publish); it only needs to identify the run in a readable way.
      - name: Compute artifact name suffix
        id: ref
        if: always()
        run: |
          echo "safe_ref=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miga-unit-test-report-${{ steps.ref.outputs.safe_ref }}-${{ steps.ref.outputs.short_sha }}
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

  # Compiles (and, depending on the branch, packages) the app. The mode decides what is built:
  # release: direct push to main (usually after merging a PR) -> full signed build.
  # pr_check: pull request to main -> checks only (lint + compile), nothing to publish.
  # dev_debug: push to any other branch, or a manual run -> a quick debug APK only.
  # Files ready to publish are left in dist/ and uploaded as an artifact so the publish job
  # (which runs on another runner) can download them without rebuilding.
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.version.outputs.version }}
      safe_ref: ${{ steps.mode.outputs.safe_ref }}
      short_sha: ${{ steps.mode.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # release: direct push to main (usually after merging a PR) -> full build + Release.
      # pr_check: pull request to main -> checks only (lint + compile), nothing is published.
      # dev_debug: push to any other branch, or a manual run -> a quick debug APK only.
      - name: Determine build mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "mode=pr_check" >> "$GITHUB_OUTPUT"
          else
            echo "mode=dev_debug" >> "$GITHUB_OUTPUT"
          fi
          # GitHub Actions artifact names do not allow "/", which is valid in a branch name
          # (e.g. "setup/initial-import"), so it is replaced with "-".
          echo "safe_ref=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # On any branch that will not run a real release build (which already compiles with
      # isMinifyEnabled=true below), check here that assembleRelease still compiles with R8, so a
      # broken ProGuard rule is caught on that branch and not only after merging.
      # The output is unsigned (no keystore secrets in this step) and is not published.
      - name: Build release APK (check R8 minification)
        if: steps.mode.outputs.mode != 'release'
        run: ./gradlew :app:assembleRelease --stacktrace

      # --- pull request to main: lint + check compilation ---
      - name: Lint (pull request)
        if: steps.mode.outputs.mode == 'pr_check'
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build debug APK (pull request)
        if: steps.mode.outputs.mode == 'pr_check'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK (pull request)
        if: steps.mode.outputs.mode == 'pr_check'
        uses: actions/upload-artifact@v4
        with:
          name: miga-debug-pr${{ github.event.pull_request.number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # --- push to a branch other than main (or a manual run): debug APK only ---
      - name: Build debug APK (rama de desarrollo)
        if: steps.mode.outputs.mode == 'dev_debug'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK (rama de desarrollo)
        if: steps.mode.outputs.mode == 'dev_debug'
        uses: actions/upload-artifact@v4
        with:
          name: miga-debug-${{ steps.mode.outputs.safe_ref }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Also puts a renamed copy in dist/ (same naming as the beta Release in the publish job) and
      # uploads it as its own artifact, so publish does not have to rebuild anything.
      - name: Normalize debug APK names (canal beta)
        if: steps.mode.outputs.mode == 'dev_debug'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          for f in app/build/outputs/apk/debug/*.apk; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            abi="${base#app-}"
            abi="${abi%-debug.apk}"
            cp "$f" "dist/miga-v${VERSION}-${abi}-debug.apk"
          done
          echo "Ficheros generados:"
          ls -la dist

      - name: Upload beta dist (para el job publish)
        if: steps.mode.outputs.mode == 'dev_debug'
        uses: actions/upload-artifact@v4
        with:
          name: miga-beta-dist-${{ steps.mode.outputs.safe_ref }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      # --- push to main: full build (debug + release per ABI + AAB) ---
      # The release keystore never lives in the repository (unlike debug.keystore): it is read from
      # 4 GitHub Actions secrets. Until they exist the release build is unsigned without breaking CI,
      # and the publish job marks the resulting Release as a pre-release.
      - name: Decode release keystore
        if: steps.mode.outputs.mode == 'release'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build debug + release APKs (por ABI + universal)
        if: steps.mode.outputs.mode == 'release'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Build release AAB (Play Store)
        if: steps.mode.outputs.mode == 'release'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Normalize output file names
        if: steps.mode.outputs.mode == 'release'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SLUG="miga"
          mkdir -p dist

          rename_apks() {
            local dir="app/build/outputs/apk/$1"
            [ -d "$dir" ] || return 0
            for f in "$dir"/*.apk; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              mid="${base#app-}"
              mid="${mid%.apk}"
              suffix=""
              if [[ "$mid" == *-unsigned ]]; then
                mid="${mid%-unsigned}"
                suffix="-unsigned"
              fi
              abi="${mid%-*}"
              build_type="${mid##*-}"
              cp "$f" "dist/${SLUG}-v${VERSION}-${abi}-${build_type}${suffix}.apk"
            done
          }

          rename_apks debug
          rename_apks release

          # Unlike APKs, Gradle does not add "-unsigned" to the AAB name when there is no
          # signingConfig, so whether it is signed is decided by the release keystore being present
          # (RELEASE_KEYSTORE_PATH, inherited from the previous step), not by the file name.
          aab_suffix=""
          if [ -z "${RELEASE_KEYSTORE_PATH:-}" ]; then
            aab_suffix="-unsigned"
          fi
          aab_dir="app/build/outputs/bundle/release"
          if [ -d "$aab_dir" ]; then
            for f in "$aab_dir"/*.aab; do
              [ -e "$f" ] || continue
              cp "$f" "dist/${SLUG}-v${VERSION}-release${aab_suffix}.aab"
            done
          fi

          echo "Ficheros generados:"
          ls -la dist

      - name: Upload build artifacts
        if: steps.mode.outputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: miga-builds-v${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # Nothing to publish for a pull request (mode == pr_check): the whole job is skipped and shows
  # as "skipped" in the checks instead of an empty success. It downloads the dist/ prepared by
  # the build job (nothing is rebuilt) and uploads it to a GitHub Release.
  publish:
    name: Publish
    needs: build
    if: needs.build.outputs.mode != 'pr_check'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Publishes run one at a time: two pushes in a row used to publish at the same moment and the
    # older build could end up overwriting the newer one.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Besides this run's own artifact (uploaded by build), a single "beta-latest" Release is
      # published or updated (to test development builds by installing the APK by hand) with the
      # latest debug APK from any development branch. The tag is fixed on purpose: every push
      # overwrites it, so releases do not pile up.
      # A run whose commit is no longer the branch head must not replace a newer build.
      - name: Check this is the latest commit of the branch
        id: latest
        if: needs.build.outputs.mode == 'dev_debug'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha || echo "")
          if [ -z "$head" ] || [ "$head" = "${{ github.sha }}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "The branch already points to $head; beta-latest is left as it is."
          fi

      - name: Download beta dist
        if: needs.build.outputs.mode == 'dev_debug' && steps.latest.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: miga-beta-dist-${{ needs.build.outputs.safe_ref }}
          path: dist

      - name: Publish beta-latest Release
        if: needs.build.outputs.mode == 'dev_debug' && steps.latest.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-latest
          name: "Miga v${{ needs.build.outputs.version }} (beta · ${{ github.ref_name }} · ${{ needs.build.outputs.short_sha }})"
          body: |
            Build de desarrollo automático, generado desde la rama `${{ github.ref_name }}`
            (commit ${{ github.sha }}). No es una versión estable: se sobrescribe en cada push
            a una rama que no es `main`.
          prerelease: true
          make_latest: false
          files: dist/*

      # Keeps beta-latest down to the APKs just published: any other file (older version names)
      # is deleted, so the release does not pile up old builds.
      - name: Remove old files from beta-latest
        if: needs.build.outputs.mode == 'dev_debug' && steps.latest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          release_id=$(gh api "repos/$repo/releases/tags/beta-latest" --jq .id)
          # The full list is read before deleting anything: deleting while paging shifts the pages
          # and skips files.
          assets=$(gh api --paginate "repos/$repo/releases/$release_id/assets?per_page=100" --jq '.[] | "\(.id) \(.name)"')
          echo "$assets" | while read -r id name; do
            if [ -n "$id" ] && [ ! -f "dist/$name" ]; then
              gh api -X DELETE "repos/$repo/releases/assets/$id" && echo "Deleted $name"
            fi
          done

      # --- push to main: stable GitHub Release with everything build left in dist/ ---
      - name: Download release dist
        if: needs.build.outputs.mode == 'release'
        uses: actions/download-artifact@v4
        with:
          name: miga-builds-v${{ needs.build.outputs.version }}
          path: dist

      - name: Create GitHub Release
        if: needs.build.outputs.mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Miga v${{ needs.build.outputs.version }}
          prerelease: ${{ secrets.RELEASE_KEYSTORE_BASE64 == '' }}
          make_latest: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
          files: dist/*
